name: Build qoder2api-hub image

# 触发方式：
#   1) push 到 main（比如点了 fork 页面的 "Sync fork"）
#   2) 每天 02:00 UTC（= 北京 10:00）自动构建上游最新代码
#   3) 手动触发，可指定上游 ref（main / v1.2.3 等）
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "要构建的上游 ref（分支或 tag，例如 main 或 v1.2.3）"
        required: false
        default: main

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  # 上游仓库。如果你以后想用自己的 fork（改过 Dockerfile）当来源，
  # 把这行换成：${{ github.repository }}
  UPSTREAM: shuishuipingan/qoder2api-hub

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取上游源码
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ github.event.inputs.ref || 'main' }}
          path: src
          fetch-depth: 1

      - name: 记录上游版本（用于镜像 tag）
        id: up
        run: |
          echo "sha=$(git -C src rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: 计算镜像名（Docker 要求全小写）
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: 准备 Buildx
        uses: docker/setup-buildx-action@v3

      # 只构建 amd64（你的飞牛是 x86_64）。要同时出 arm64 就加 setup-qemu-action，
      # 并在下面的 build 步骤里加一行：platforms: linux/amd64,linux/arm64
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像 tag
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ steps.up.outputs.sha }}
            type=raw,value=${{ steps.up.outputs.date }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: src
          file: src/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
