name: Build qoder2api-hub image

# 触发方式：
#   1) push 到 main
#   2) 每天 02:00 UTC（北京 10:00）检查上游有没有新 release —— 没有就几秒内结束，不构建
#   3) 手动 Run workflow：可指定 ref，可用 force 强制重建
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "留空 = 自动取上游最新 release tag；也可填 main 或某个 tag"
        required: false
        default: ""
      force:
        description: "即使该版本镜像已存在也强制重建"
        type: boolean
        default: false

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # 上游仓库。如果你以后想用自己的 fork（改过 Dockerfile）当来源，
  # 把这行换成：${{ github.repository }}
  UPSTREAM: shuishuipingan/qoder2api-hub

jobs:
  # ---------------------------------------------------------------------------
  # 只在「上游有新 release 且对应镜像还没构建过」时才继续
  # ---------------------------------------------------------------------------
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      tag: ${{ steps.detect.outputs.tag }}
      skip: ${{ steps.detect.outputs.skip }}
      image: ${{ steps.detect.outputs.image }}
    steps:
      - name: 检测上游最新 release / 已有镜像 tag
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_REF: ${{ github.event.inputs.ref }}
          FORCE: ${{ inputs.force || false }}
        run: |
          set -uo pipefail
          IMAGE="$(echo "ghcr.io/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          REPO_LC="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

          if [ -n "${INPUT_REF:-}" ]; then
            TAG="${INPUT_REF}"
            echo "手动指定 ref：${TAG}"
          else
            TAG="$(curl -fsSL "https://api.github.com/repos/${UPSTREAM}/releases/latest" | jq -r '.tag_name // empty')"
            echo "上游最新 release：${TAG:-（取不到，回退 main）}"
            TAG="${TAG:-main}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          TOKEN="$(curl -fsSL -u "${GITHUB_ACTOR}:${GH_TOKEN}" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:${REPO_LC}:pull" \
            | jq -r '.token // empty')" || true
          EXIST=""
          if [ -n "${TOKEN}" ]; then
            EXIST="$(curl -fsSL -H "Authorization: Bearer ${TOKEN}" \
              "https://ghcr.io/v2/${REPO_LC}/tags/list" 2>/dev/null \
              | jq -r --arg t "${TAG}" '.tags[]? | select(. == $t)')" || true
          fi

          if [ -n "${EXIST}" ] && [ "${FORCE}" != "true" ]; then
            echo "==> 镜像 ${IMAGE}:${TAG} 已存在，跳过构建。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "==> 需要构建 ${IMAGE}:${TAG}"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 取上游源码
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ needs.check.outputs.tag }}
          path: src
          fetch-depth: 1

      - name: 记录上游 commit
        id: up
        run: echo "sha=$(git -C src rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # 只构建 amd64（你的飞牛是 x86_64）。要同时出 arm64 就加 setup-qemu-action，
      # 并在下面的 build 步骤里加一行：platforms: linux/amd64,linux/arm64
      - name: 准备 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像 tag
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.check.outputs.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.check.outputs.tag }}
            type=raw,value=sha-${{ steps.up.outputs.sha }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: src
          file: src/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
